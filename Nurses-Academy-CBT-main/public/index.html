<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="%PUBLIC_URL%/logo.png" type="image/png" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0D9488" />
  <meta name="description" content="The Elite Nurses — Your Path to Nursing Excellence. Smart nursing exam preparation with past questions, AI explanations and mock exams." />
  <meta name="keywords" content="NMCN, nursing exam, CBT, nursing council nigeria, past questions, nursing practice, The Elite Nurses" />

  <!-- ── Security: prevent offline save / caching of exam content ── -->
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma"        content="no-cache" />
  <meta http-equiv="Expires"       content="0" />

  <!-- PWA -->
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/icons/icon-192.png" />

  <!-- Open Graph -->
  <meta property="og:title"       content="The Elite Nurses — Your Path to Nursing Excellence" />
  <meta property="og:description" content="Nigeria's smartest nursing exam prep platform" />
  <meta property="og:type"        content="website" />

  <title>The Elite Nurses — Your Path to Nursing Excellence</title>

  <!-- Preconnect for Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Paystack Inline JS -->
  <script src="https://js.paystack.co/v1/inline.js"></script>
</head>
<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root">
    <div id="boot-fallback" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0B1220;color:#E5E7EB;font-family:Georgia,serif;text-align:center;padding:32px;">
      <div style="font-size:40px;margin-bottom:16px;">🩺</div>
      <div style="font-size:14px;color:#9CA3AF;">Loading The Elite Nurses…</div>
    </div>
  </div>
  <script>
    // Watchdog: if React hasn't mounted (replaced #boot-fallback) within 8s of
    // load — most likely a stale service-worker cache serving a JS chunk that
    // no longer exists after a redeploy — offer a hard reload instead of
    // leaving the user staring at a stuck loading screen or blank page.
    (function () {
      window.addEventListener('load', function () {
        setTimeout(function () {
          var fallback = document.getElementById('boot-fallback');
          if (!fallback) return; // React mounted fine, nothing to do
          fallback.innerHTML =
            '<div style="font-size:40px;margin-bottom:16px;">⚠️</div>' +
            '<div style="font-size:14px;color:#9CA3AF;margin-bottom:20px;max-width:280px;">Taking longer than usual to load. This can happen after an update — try reloading.</div>' +
            '<button onclick="if(window.caches){caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k)})}).finally(function(){location.reload(true)})}else{location.reload(true)}" ' +
            'style="padding:12px 28px;border-radius:12px;border:none;background:#0D9488;color:#fff;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit;">🔄 Reload App</button>';
        }, 8000);
      });
    })();
  </script>
</body>
</html>
