name: Deploy to Firebase

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  deploy-firestore-rules:
    # Deploys firestore.rules / firestore.indexes.json. Previously this repo
    # had NO step deploying rules at all — hosting and functions deployed
    # fine, but rules changes in git were never pushed live, causing
    # permission-denied errors to persist even after "fixes" were merged.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ELITECAREHUB_A80DA }}'

      - name: Deploy Firestore rules
        working-directory: Nurses-Academy-CBT-main
        run: npx firebase-tools deploy --only firestore:rules --project elitecarehub-a80da --non-interactive

      # NOTE: firestore:indexes is deliberately NOT deployed automatically here.
      # The live project currently has 3 indexes not present in
      # firestore.indexes.json — deploying indexes in non-interactive mode
      # would require --force, which silently DELETES those live indexes.
      # Review what they are first (see comment in firestore.indexes.json),
      # then either add them to the file or deploy indexes manually with
      # --force once you're sure it's safe.

  deploy-functions:
    # Only on actual pushes to main — not PR previews, and only if
    # functions/ actually changed, so this doesn't run on every hosting-only
    # commit.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install function dependencies
        working-directory: functions
        run: npm ci || npm install

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ELITECAREHUB_A80DA }}'

      - name: Deploy Cloud Functions
        run: npx firebase-tools deploy --only functions --project elitecarehub-a80da --non-interactive
